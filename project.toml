[project]
name = "NoiseFit-Halo-Face-Builder"
description = "Offline pipeline that turns a photo into a native NoiseFit Halo watch face (afafaf02 container, 466x466 RGB565 big-endian, LZO1X per 4096-byte block) and installs it over Bluetooth LE. No server, no account, no root."
version = "2.1.0"
license = "MIT"
repository = "https://github.com/star-warrior/jailbreak-noiseFit"
protocol_reference = "https://github.com/star-warrior/jailbreak/blob/main/PROTOCOL.md"

[metadata]
author = "Jay"
keywords = ["noisefit", "halo", "watchface", "ble", "offline", "android", "lzo1x", "rgb565", "reverse-engineering"]
categories = ["utilities", "wearables", "bluetooth"]

[build]
android = "android/"
description = "Android app (Java, no dependencies): crop, build, self-check, upload."
pc_reference = "builder/"
pc_description = "Python reference implementation of the same container format."

[tools]
jdk = { version = "17", description = "Required for AGP 8.7" }
android_sdk = { version = "34", description = "Compile and target SDK" }
gradle = { version = ">=8.7", description = "No wrapper is checked in" }
python = { version = ">=3.9", description = "Optional PC reference tools" }
pillow = { version = ">=10.0", description = "pip install pillow (PC tools only)" }

[scripts]
android_build = "cd android && gradle assembleDebug --no-daemon"
android_install = "adb install -r android/app/build/outputs/apk/debug/app-debug.apk"
build_face = "python builder/build_face.py <input> <output.lz>"
verify_build = "python builder/verify_build.py <face.lz>"
generate_replay = "python builder/generate_replay.py <face.lz> android/app/src/main/assets/replay3.txt"
upload_watch = ".\\scripts\\upload.ps1"

[device]
model = "NoiseFit Halo"
display = "466x466 round"
container_magic = "afafaf02"
compression = "LZO1X, 4096-byte blocks"
pixel_format = "RGB565 big-endian"
uncompressed_size = 754368
profile = "profiles/halo.json"

[ble]
service_uuid = "16186F00-0000-1000-8000-00807F9B34FB"
data_uuid = "16186F04-0000-1000-8000-00807F9B34FB"
command_uuid_a = "16186F01-0000-1000-8000-00807F9B34FB"
command_uuid_b = "16186F02-0000-1000-8000-00807F9B34FB"
chunk_bytes = 177
max_chunks_per_window = 22
mtu_request = 247
flow_control_after_marker = "000001010000"
flow_control_after_last_chunk = "000001000000"

[features]
crop_dialog = true
on_device_build = true
self_check_before_upload = true
pre_generated_faces = ["watchfaces/face_solid.lz", "watchfaces/face_gradient.lz", "watchfaces/face_random.lz"]

[status]
transport = "verified"
container = "verified"
blob_layout = "verified"
photo_rendering = "verified"
clock_cell_backgrounds = "open"
metadata_widgets = "open"
other_models = "untested"

[supported-os]
windows = true
linux = true
macos = true
android = true

[issues]
tracker = "https://github.com/star-warrior/jailbreak-noiseFit/issues"
